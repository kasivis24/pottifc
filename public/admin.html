<!doctype html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pottifc · admin</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --line: #272c36;
    --text: #e7e9ee;
    --muted: #9aa3b2;
    --accent: #4f8cff;
    --ok: #35c07f;
    --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 16px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=url], input[type=text], select {
    width: 100%; padding: 11px 12px; border-radius: 9px;
    border: 1px solid var(--line); background: #0d0f14; color: var(--text);
    font: inherit; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 18px; color: var(--muted); font-size: 14px; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }
  button {
    margin-top: 22px; width: 100%; padding: 13px; border: 0; border-radius: 9px;
    background: var(--accent); color: #fff; font: 600 15px/1 inherit; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: default; }
  #msg { min-height: 20px; margin-top: 12px; font-size: 13px; text-align: center; }
  #msg.ok { color: var(--ok); }
  #msg.err { color: var(--err); }
  .preview { margin-top: 24px; }
  .preview img {
    width: 100%; height: 200px; object-fit: cover; border-radius: 10px;
    background: #0d0f14; border: 1px solid var(--line); display: block;
  }
  .preview img.contain { object-fit: contain; }
  a { color: var(--accent); }
  .foot { margin-top: 20px; text-align: center; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>pottifc admin</h1>
  <p class="sub">இங்க கொடுக்கிற URL உடனே live page-ல மாறிடும்.</p>

  <div class="card">
    <label for="imageUrl">Image URL</label>
    <input id="imageUrl" type="url" placeholder="https://example.com/photo.jpg" autocomplete="off">

    <label for="audioUrl">Audio URL</label>
    <input id="audioUrl" type="url" placeholder="https://example.com/sound.mp3" autocomplete="off">

    <div class="row">
      <div>
        <label for="fit">Image fit</label>
        <select id="fit">
          <option value="cover">Cover (full screen, crop ஆகும்)</option>
          <option value="contain">Contain (முழு image தெரியும்)</option>
        </select>
      </div>
      <div>
        <label for="background">Background</label>
        <input id="background" type="text" value="#000000" autocomplete="off">
      </div>
    </div>

    <label class="check"><input id="loop" type="checkbox" checked> Audio loop</label>

    <button id="save" disabled>Save</button>
    <div id="msg">ஏற்றப்படுகிறது…</div>

    <div class="preview">
      <img id="preview" alt="">
    </div>
  </div>

  <p class="foot"><a id="open" href="./" target="_blank" rel="noopener">Live page-ஐ பார்க்க →</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import { firebaseConfig, CONFIG_PATH } from "./firebase-config.js";

const el = (id) => document.getElementById(id);
const fields = {
  imageUrl: el("imageUrl"),
  audioUrl: el("audioUrl"),
  fit: el("fit"),
  background: el("background"),
  loop: el("loop"),
};
const msg = el("msg");
const preview = el("preview");
const saveBtn = el("save");

const configRef = ref(getDatabase(initializeApp(firebaseConfig)), CONFIG_PATH);

function say(text, kind) {
  msg.textContent = text;
  msg.className = kind || "";
}

function paintPreview() {
  preview.src = fields.imageUrl.value.trim();
  preview.classList.toggle("contain", fields.fit.value === "contain");
  preview.style.background = fields.background.value.trim() || "#000";
}

let loaded = false;
onValue(configRef, (snap) => {
  const cfg = snap.val() || {};
  // Don't stomp on what is being typed after the first load.
  if (!loaded) {
    fields.imageUrl.value = cfg.imageUrl || "";
    fields.audioUrl.value = cfg.audioUrl || "";
    fields.fit.value = cfg.fit === "contain" ? "contain" : "cover";
    fields.background.value = cfg.background || "#000000";
    fields.loop.checked = cfg.loop !== false;
    paintPreview();
    loaded = true;
    saveBtn.disabled = false;
    say("");
  }
}, (err) => say("படிக்க முடியலை: " + err.message, "err"));

[fields.imageUrl, fields.fit, fields.background].forEach((f) =>
  f.addEventListener("input", paintPreview)
);
fields.fit.addEventListener("change", paintPreview);

saveBtn.addEventListener("click", async () => {
  const payload = {
    imageUrl: fields.imageUrl.value.trim(),
    audioUrl: fields.audioUrl.value.trim(),
    fit: fields.fit.value,
    background: fields.background.value.trim() || "#000000",
    loop: fields.loop.checked,
    updatedAt: Date.now(),
  };
  if (!payload.imageUrl) return say("Image URL கொடுங்க.", "err");

  saveBtn.disabled = true;
  say("சேமிக்கிறேன்…");
  try {
    await set(configRef, payload);
    say("சேமிச்சாச்சு ✓", "ok");
  } catch (err) {
    say("சேமிக்க முடியலை: " + err.message, "err");
  } finally {
    saveBtn.disabled = false;
  }
});
</script>
</body>
</html>
